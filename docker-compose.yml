version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vetcare-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-vetuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vetpassword}
      POSTGRES_DB: ${DB_NAME:-vetcare}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
